const rad=d=>d*Math.PI/180,pt=(r,d)=>[290+r*Math.cos(rad(d)),290+r*Math.sin(rad(d))].map(v=>v.toFixed(1)).join(',');
function sector(i){const c=-90+i*STEP,a0=c-STEP/2+.8,a1=c+STEP/2-.8,R1=180,R0=100;return`M${pt(R1,a0)}A${R1} ${R1} 0 0 1 ${pt(R1,a1)}L${pt(R0,a1)}A${R0} ${R0} 0 0 0 ${pt(R0,a0)}Z`}
function wheel(o={}){const{sel=-1,hi=[],pos=null,hole=['16','BiaCons'],face=-1}=o;
 let s=`<svg class="wheel" viewBox="0 0 580 580" role="group" aria-label="Wheel of 16 BiaCons">`;
 for(let i=0;i<N;i++){const dim=hi.length&&!hi.includes(i)||(sel>=0&&sel!==i&&!hi.length);
  s+=`<g class="seg" data-i="${i}" tabindex="0" role="button" aria-label="${P[i][0]}" style="opacity:${dim?.3:1}"><path d="${sector(i)}" fill="${col(i)}"/></g>`;
  const c=-90+i*STEP,[x,y]=pt(194,c).split(','),cs=Math.cos(rad(c)),an=cs>.25?'start':cs<-.25?'end':'middle';
  s+=`<text class="wl" x="${x}" y="${(+y+4).toFixed(1)}" text-anchor="${an}"${dim?' opacity=".45"':''}>${P[i][0]}</text>`}
 if(pos!==null){const [mx,my]=pt(140,-90+pos*STEP).split(',');s+=`<circle cx="${mx}" cy="${my}" r="14" fill="var(--bg)" stroke="var(--ink)" stroke-width="4"/><text x="${mx}" y="${+my+4}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)" font-family="Figtree">YOU</text>`}
 s+=face>=0?`<g transform="translate(224 214) scale(.66)">${mascotInner(face)}</g></svg>`:`<text x="290" y="288" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="${hole[0].length>3?24:44}" fill="var(--ink)">${hole[0]}</text><text x="290" y="312" text-anchor="middle" font-size="14" fill="var(--mute)" font-family="Figtree">${hole[1]}</text></svg>`;return s}
function wire(fn){app.querySelectorAll('.seg').forEach(g=>{g.onclick=()=>fn(+g.dataset.i);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(+g.dataset.i)}}})}
function calc(){let x=0,y=0,w=Array(N).fill(0);Q.forEach((q,j)=>w[q[1]]+=ans[j]);const m=w.reduce((a,b)=>a+b)/N;
 w.forEach((v,i)=>{x+=(v-m)*Math.cos(rad(i*STEP));y+=(v-m)*Math.sin(rad(i*STEP))});
 let pos=Math.atan2(y,x)/rad(STEP);if(Math.hypot(x,y)<.01)pos=w.indexOf(Math.max(...w));pos=(pos%N+N)%N;
 const a=Math.floor(pos),t=pos-a;return{pos,a,b:(a+1)%N,t,w:w.map(v=>Math.round((v-2)/8*100))}}
const views={
home(){let cur=-1;const draw=()=>{app.innerHTML=`<div style="text-align:center"><h1>Find your place on the wheel.</h1><p class="lead" style="margin:0 auto 12px">Sixteen BiaCons sit around a circle. Your result is a blend of the two nearest neighbors.</p></div>${wheel({sel:cur,face:cur})}
 <div class="info">${cur<0?'<p style="margin:0 auto" class="soon">Select any segment to preview it.</p>':`<h3><span class="sw" style="background:${col(cur)}"></span>${P[cur][0]}</h3><p style="margin:0 auto">${P[cur][1]}</p><p class="soon">Between ${P[(cur+15)%N][0]} and ${P[(cur+1)%N][0]}.</p><p><a class="more" href="#/b/${cur}">Read the full profile</a></p>`}</div>
 <div class="row" style="justify-content:center"><a class="btn" href="#/test">Take the test</a><a class="btn ghost" href="#/all">Browse all 16</a></div>`;wire(i=>{cur=cur===i?-1:i;draw()})};draw()},
test(){if(ans.every(a=>a!==null)){idx=0;ans=Array(Q.length).fill(null)}
 const draw=()=>{const L=['Disagree strongly','Disagree','Neutral','Agree','Agree strongly'];
 app.innerHTML=`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${idx}"><div style="width:${idx/Q.length*100}%"></div></div><small style="color:var(--mute)">Question ${idx+1} of ${Q.length}</small>
 <p class="q" id="qt">${Q[idx][0]}</p><div class="scale" role="group" aria-labelledby="qt">${[1,2,3,4,5].map(v=>`<button data-v="${v}" aria-label="${L[v-1]}" class="${ans[idx]===v?'sel':''}">${v}</button>`).join('')}</div>
 <div class="ends"><span>Disagree</span><span>Agree</span></div><div class="row"><button class="btn ghost" id="back" ${idx?'':'disabled style="opacity:.4"'}>Back</button></div>`;
 app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ans[idx]=+b.dataset.v;b.classList.add('sel');setTimeout(()=>{if(idx<Q.length-1){idx++;draw()}else{try{localStorage.setItem('wheelhouse',JSON.stringify(ans))}catch(e){}location.hash='#/results'}},180)});
 $('#back').onclick=()=>{if(idx){idx--;draw()}}};draw()},
results(){if(ans.some(a=>a===null)){try{const s=JSON.parse(localStorage.getItem('wheelhouse'));if(s&&s.length===Q.length)ans=s}catch(e){}}
 if(ans.some(a=>a===null)){app.innerHTML=`<h2>No results yet</h2><p>Finish the 32-question test to see your place on the wheel.</p><a class="btn" href="#/test">Start the test</a>`;return}
 const r=calc(),pa=Math.round((1-r.t)*100),pb=100-pa,{a,b}=r,top=r.w.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]);
 app.innerHTML=`<p style="margin:0;color:var(--mute)">Your BiaCon is a blend of</p><h1>${P[a][0]} + ${P[b][0]}</h1>
 <div class="res"><div>${wheel({hi:[a,b],pos:r.pos,hole:['You','on the wheel']})}</div><div>
 <div class="mix" aria-label="${pa}% ${P[a][0]}, ${pb}% ${P[b][0]}"><div style="width:${pa}%;background:${col(a)}"></div><div style="width:${pb}%;background:${col(b)}"></div></div>
 <p style="display:flex;justify-content:space-between;font-weight:600;margin:0 0 20px"><span>${P[a][0]} ${pa}%</span><span>${P[b][0]} ${pb}%</span></p>
 ${[a,b].map(i=>`<div class="card" style="margin-bottom:12px;display:flex;gap:14px;align-items:center"><div style="flex:none">${mascot(i,84)}</div><div><h3><span class="sw" style="background:${col(i)}"></span>${P[i][0]}</h3><p style="margin:0 0 6px">${P[i][1]}</p><p style="margin:0"><a class="more" href="#/b/${i}">Read the full profile</a></p></div></div>`).join('')}</div></div>
 <h3 style="margin-top:32px">Your score for each BiaCon</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px">${top.map(([v,i])=>`<div class="bar"><span>${P[i][0]}</span><i style="width:${Math.max(v,3)}%;max-width:55%;background:${col(i)}"></i><span style="width:auto;color:var(--mute)">${v}%</span></div>`).join('')}</div>
 <div class="row"><a class="btn" href="#/test" id="rt">Retake the test</a><a class="btn ghost" href="#/all">Browse all 16</a><button class="btn ghost" id="cp">Copy my result</button></div>
 <p class="note">Your position comes from how strongly you agreed with each BiaCon\u2019s statements, so it is a blend, not a box. Mood and context affect answers.</p>`;
 $('#rt').onclick=()=>{ans=Array(Q.length).fill(null);idx=0};
 $('#cp').onclick=e=>{const t=`On the BiaRealm BiaCon wheel I'm ${pa}% ${P[a][0]} and ${pb}% ${P[b][0]}.`;try{navigator.clipboard.writeText(t);e.target.textContent='Copied'}catch(x){e.target.textContent=t}}},
b(i){i=+i;if(!(i>=0&&i<N)){location.hash='#/all';return}const x=B[i],n=P[i][0],pv=(i+15)%N,nx=(i+1)%N,ul=a=>'<ul class="pf">'+a.map(t=>'<li>'+t+'</li>').join('')+'</ul>';
 app.innerHTML=`<p><a class="more" href="#/all">All BiaCons</a></p><div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap">${mascot(i,210)}<div style="flex:1;min-width:240px"><h1 style="margin:0 0 10px">${n}</h1><p class="lead" style="margin:0">${P[i][1]}</p></div></div><p style="margin-top:24px">${x[0]}</p>
 <div class="grid"><div class="card"><h3>Strengths</h3>${ul(x[1])}</div><div class="card"><h3>Challenges</h3>${ul(x[2])}</div><div class="card"><h3>In relationships</h3><p style="margin:0">${x[3]}</p></div><div class="card"><h3>At work</h3><p style="margin:0">${x[4]}</p></div></div>
 <h3 style="margin-top:32px">Next on the wheel</h3><p>The BiaCons on either side of ${n} share many of its traits, which is why blended results are common.</p>
 <div class="row"><a class="btn ghost" href="#/b/${pv}">${P[pv][0]}</a><a class="btn ghost" href="#/b/${nx}">${P[nx][0]}</a><a class="btn" href="#/test">Take the test</a></div>`},
all(){app.innerHTML=`<h2>The 16 BiaCons</h2><p class="lead">Listed in wheel order. Each one borders the next, and the last connects back to the first.</p><div class="grid">${P.map((p,i)=>`<div class="card"><div style="text-align:center">${mascot(i,100)}</div><h3><span class="sw" style="background:${col(i)}"></span>${p[0]}</h3><p style="margin:0 0 8px">${p[1]}</p><p style="font-size:.88rem;color:var(--mute);margin:0 0 4px">Neighbors: ${P[(i+15)%N][0]} and ${P[(i+1)%N][0]}</p><a class="more" href="#/b/${i}">Read the full profile</a></div>`).join('')}</div>`},
about(){app.innerHTML=`<h2>How the wheel works</h2><p class="lead">Personality isn\u2019t a set of separate boxes. BiaRealm arranges 16 personality types, called BiaCons, in a circle so that similar ones sit side by side.</p>
 <div class="grid"><div class="card"><h3>The test</h3><p style="margin:0">32 statements, two for each BiaCon, answered from strongly disagree to strongly agree.</p></div>
 <div class="card"><h3>Your position</h3><p style="margin:0">Your answers pull you toward certain BiaCons. Where those pulls balance out is your spot on the wheel, which falls between two neighbors.</p></div>
 <div class="card"><h3>What\u2019s next</h3><p style="margin:0">Every BiaCon now has a full profile. Profiles for each pairing are coming soon.</p></div></div>`}};
function route(){const h=(location.hash.replace('#/','')||'home').split('?')[0],[r,arg]=h.split('/');(views[r]||views.home)(arg);
 document.querySelectorAll('nav a.l').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+(r==='home'?'':r)||(r==='results'&&a.getAttribute('href')==='#/test')||(r==='b'&&a.getAttribute('href')==='#/all')));scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
