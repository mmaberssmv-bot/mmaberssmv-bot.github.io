<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BiaRealm – The 16 BiaCon Wheel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f4f9;--surface:#fff;--ink:#1f1b2e;--mute:#625d75;--line:#ddd8e8;--l:48%;--acc:#4b5bf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14111f;--surface:#1e1a2e;--ink:#f1eefa;--mute:#a9a3bf;--line:#342e4a;--l:62%;--acc:#8591ff}}
:root[data-theme="dark"]{--bg:#14111f;--surface:#1e1a2e;--ink:#f1eefa;--mute:#a9a3bf;--line:#342e4a;--l:62%;--acc:#8591ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.1;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800}
h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700}
h3{font-size:1.25rem;font-weight:700}
p{margin:0 0 1em;max-width:62ch}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.logo{font:800 1.3rem 'Bricolage Grotesque',sans-serif;text-decoration:none;color:inherit}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav a.l{display:block;padding:6px 12px;border-radius:99px;text-decoration:none;font-weight:500;color:var(--mute)}
nav a.l:hover,nav a.l.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:14px 28px;font:600 1rem Figtree,sans-serif;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
main{padding:40px 0 72px;min-height:70vh}
.lead{font-size:1.15rem;color:var(--mute)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;flex:none}
.soon{color:var(--mute);font-size:.9rem;font-style:italic;margin:0}
svg.wheel{width:100%;max-width:560px;display:block;margin:0 auto;overflow:visible}
.seg{cursor:pointer;transition:opacity .2s}
.seg path{stroke:var(--bg);stroke-width:2}
.seg:hover path{filter:brightness(1.12)}
.wl{font:600 13px Figtree,sans-serif;fill:var(--ink);pointer-events:none}
.info{text-align:center;min-height:130px;margin-top:8px}
/* test */
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.prog div{height:100%;background:var(--acc);transition:width .3s}
.q{font:700 clamp(1.5rem,4vw,2.2rem)/1.2 'Bricolage Grotesque';margin:48px 0 36px;max-width:22em;min-height:3.6em}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:600px}
.scale button{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;font:600 1rem Figtree;color:var(--ink);justify-self:center;width:100%;max-width:84px}
.scale button:hover{border-color:var(--ink)}
.scale button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ends{display:flex;justify-content:space-between;max-width:600px;color:var(--mute);font-size:.9rem;margin-top:12px}
.res{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center}
@media(max-width:760px){.res{grid-template-columns:1fr}}
.mix{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar{display:flex;align-items:center;gap:8px;font-size:.88rem;margin-bottom:5px}
.bar span:first-child{width:92px;flex:none}
.bar i{display:block;height:8px;border-radius:9px}
.note{font-size:.9rem;color:var(--mute);border-top:1px solid var(--line);padding-top:16px;margin-top:36px}
a.more{font-weight:600;color:var(--ink)}ul.pf{margin:0;padding-left:20px}ul.pf li{margin-bottom:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><nav aria-label="Main">
<a class="logo" href="#/">BiaRealm</a>
<ul><li><a class="l" href="#/">Home</a></li><li><a class="l" href="#/test">Take the test</a></li><li><a class="l" href="#/all">The 16</a></li><li><a class="l" href="#/about">About</a></li></ul>
</nav></div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap note">BiaRealm is a free tool for self-reflection, not a clinical assessment. Answers stay in your browser.</div></footer>

